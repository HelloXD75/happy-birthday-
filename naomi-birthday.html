<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Naomi 🎉</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --purple-deep: #1e1033;
    --purple-mid: #3d1f66;
    --purple-glow: #7c3aed;
    --pink-accent: #f0abfc;
    --gold-accent: #ffd166;
    --cream: #fdf7ff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 20% 20%, #4a2585 0%, transparent 45%),
                radial-gradient(circle at 80% 75%, #6d28d9 0%, transparent 50%),
                linear-gradient(160deg, var(--purple-deep) 0%, var(--purple-mid) 55%, #2a1454 100%);
    background-attachment: fixed;
    font-family: 'Quicksand', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    padding: 24px;
  }

  /* soft ambient sparkle layer */
  .sparkle-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }

  .sparkle {
    position: absolute;
    color: var(--gold-accent);
    opacity: 0;
    animation: twinkle 3.5s ease-in-out infinite;
    filter: drop-shadow(0 0 4px rgba(255, 209, 102, 0.8));
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 0.85; transform: scale(1.1); }
  }

  /* falling confetti emojis */
  .confetti-field {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }

  .confetti {
    position: absolute;
    top: -10%;
    font-size: 1.6rem;
    animation-name: fall;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    opacity: 0.9;
    will-change: transform;
  }

  @keyframes fall {
    0% {
      transform: translateY(-10vh) translateX(0) rotate(0deg);
    }
    100% {
      transform: translateY(110vh) translateX(var(--drift, 40px)) rotate(360deg);
    }
  }

  /* main card */
  .card {
    position: relative;
    z-index: 3;
    text-align: center;
    max-width: 640px;
    width: 100%;
    padding: 56px 32px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 30px 80px rgba(20, 4, 50, 0.55), inset 0 1px 0 rgba(255,255,255,0.08);
    animation: riseIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(28px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .eyebrow {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    font-size: 0.72rem;
    color: var(--pink-accent);
    margin-bottom: 18px;
    opacity: 0.85;
  }

  .cake-row {
    font-size: 2.6rem;
    margin-bottom: 14px;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 6vw, 3.4rem);
    line-height: 1.15;
    color: var(--cream);
    letter-spacing: -0.01em;
    text-shadow:
      0 0 18px rgba(240, 171, 252, 0.55),
      0 0 40px rgba(124, 58, 237, 0.45);
    animation: glowPulse 3.2s ease-in-out infinite;
    transition: opacity 0.35s ease;
  }

  h1.switching {
    opacity: 0;
  }

  @keyframes glowPulse {
    0%, 100% {
      text-shadow:
        0 0 18px rgba(240, 171, 252, 0.45),
        0 0 40px rgba(124, 58, 237, 0.35);
    }
    50% {
      text-shadow:
        0 0 26px rgba(240, 171, 252, 0.8),
        0 0 60px rgba(124, 58, 237, 0.6);
    }
  }

  .subtext {
    margin-top: 16px;
    color: rgba(253, 247, 255, 0.65);
    font-size: 1rem;
    font-weight: 500;
  }

  .lang-toggle {
    margin-top: 38px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 13px 30px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    background: linear-gradient(135deg, rgba(124, 58, 237, 0.55), rgba(240, 171, 252, 0.35));
    color: var(--cream);
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
  }

  .lang-toggle:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 32px rgba(124, 58, 237, 0.5);
  }

  .lang-toggle:active {
    transform: translateY(-1px) scale(0.98);
  }

  .lang-toggle .flag {
    font-size: 1.1rem;
  }

  /* photo gallery */
  .photo-gallery {
    margin-top: 42px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .photo-frame {
    width: 220px;
    max-width: 42vw;
    aspect-ratio: 1 / 1;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow:
      0 18px 40px rgba(20, 4, 50, 0.5),
      0 0 28px rgba(240, 171, 252, 0.28),
      0 0 0 1px rgba(255, 255, 255, 0.04) inset;
    background: rgba(255, 255, 255, 0.06);
    transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s ease;
  }

  .photo-frame:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow:
      0 24px 50px rgba(20, 4, 50, 0.6),
      0 0 40px rgba(240, 171, 252, 0.45),
      0 0 0 1px rgba(255, 255, 255, 0.06) inset;
  }

  .photo-frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  @media (max-width: 480px) {
    .photo-gallery {
      flex-direction: column;
      gap: 18px;
    }

    .photo-frame {
      width: 68vw;
      max-width: 68vw;
    }
  }

  footer {
    position: relative;
    z-index: 3;
    margin-top: 22px;
  }

  @media (max-width: 480px) {
    .card { padding: 42px 22px; border-radius: 22px; }
    .cake-row { font-size: 2.1rem; }
    .lang-toggle { padding: 12px 24px; font-size: 0.88rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.001ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.001ms !important;
    }
  }
</style>
</head>
<body>

  <div class="sparkle-field" id="sparkleField"></div>
  <div class="confetti-field" id="confettiField"></div>

  <main class="card">
    <div class="eyebrow" id="eyebrow">A special day</div>
    <div class="cake-row">🎂 ✨ 🎈</div>
    <h1 id="mainMessage">Happy Birthday Naomi 🎉🎂</h1>
    <p class="subtext" id="subtext">Wishing you a day as wonderful as you are.</p>

    <!-- ================================================
         PHOTO GALLERY
         To use your own pictures, place them in the SAME
         FOLDER as this HTML file and replace the file
         names below (photo1.jpg / photo2.jpg) with your
         own file names if they're different.
         ================================================ -->
    <div class="photo-gallery">
      <div class="photo-frame">
        <img src="photo1.jpg" alt="Birthday photo 1"> <!-- REPLACE: photo1.jpg -->
      </div>
      <div class="photo-frame">
        <img src="photo2.jpg" alt="Birthday photo 2"> <!-- REPLACE: photo2.jpg -->
      </div>
    </div>

    <button class="lang-toggle" id="langToggle" onclick="toggleLanguage()">
      <span class="flag">🌐</span>
      <span id="toggleLabel">Ver en Español</span>
    </button>
  </main>

  <script>
    // ---------- Language toggle ----------
    let isSpanish = false;
    const messages = {
      en: {
        main: "Happy Birthday Naomi 🎉🎂",
        eyebrow: "A special day",
        sub: "Wishing you a day as wonderful as you are.",
        toggle: "Ver en Español"
      },
      es: {
        main: "Feliz Cumpleaños Naomi 🎉🎂",
        eyebrow: "Un día especial",
        sub: "Deseándote un día tan maravilloso como tú.",
        toggle: "View in English"
      }
    };

    const h1 = document.getElementById('mainMessage');
    const eyebrow = document.getElementById('eyebrow');
    const subtext = document.getElementById('subtext');
    const toggleLabel = document.getElementById('toggleLabel');

    function toggleLanguage() {
      isSpanish = !isSpanish;
      const lang = isSpanish ? messages.es : messages.en;

      h1.classList.add('switching');
      eyebrow.style.opacity = 0;
      subtext.style.opacity = 0;

      setTimeout(() => {
        h1.textContent = lang.main;
        eyebrow.textContent = lang.eyebrow;
        subtext.textContent = lang.sub;
        toggleLabel.textContent = lang.toggle;
        h1.classList.remove('switching');
        eyebrow.style.opacity = 0.85;
        subtext.style.opacity = 1;
      }, 350);
    }

    // ---------- Falling confetti emojis ----------
    const confettiEmojis = ['🎉', '🎈', '🎂', '✨', '🎊'];
    const confettiField = document.getElementById('confettiField');
    const CONFETTI_COUNT = 26;

    for (let i = 0; i < CONFETTI_COUNT; i++) {
      const span = document.createElement('span');
      span.className = 'confetti';
      span.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];

      const left = Math.random() * 100;
      const duration = 8 + Math.random() * 9;
      const delay = Math.random() * 12;
      const drift = (Math.random() * 120 - 60) + 'px';
      const size = 1.1 + Math.random() * 1.3;

      span.style.left = left + 'vw';
      span.style.fontSize = size + 'rem';
      span.style.setProperty('--drift', drift);
      span.style.animationDuration = duration + 's';
      span.style.animationDelay = '-' + delay + 's';

      confettiField.appendChild(span);
    }

    // ---------- Ambient sparkles ----------
    const sparkleField = document.getElementById('sparkleField');
    const SPARKLE_COUNT = 18;
    const sparkleChars = ['✦', '✧', '⋆', '✩'];

    for (let i = 0; i < SPARKLE_COUNT; i++) {
      const s = document.createElement('span');
      s.className = 'sparkle';
      s.textContent = sparkleChars[Math.floor(Math.random() * sparkleChars.length)];
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.fontSize = (0.7 + Math.random() * 1.1) + 'rem';
      s.style.animationDuration = (2.5 + Math.random() * 3) + 's';
      s.style.animationDelay = (Math.random() * 4) + 's';
      sparkleField.appendChild(s);
    }
  </script>
</body>
</html>
